spring.application.name=FitCo

# ─── Cloud SQL - PostgreSQL (Google Cloud, Public IP) ────────────────────────
spring.datasource.url=jdbc:postgresql://35.255.187.72:5432/FitCoDataBase?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Rakshith@1997
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Spring Security ─────────────────────────────────────────────────────────
spring.security.user.name=admin
spring.security.user.password=admin

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=fitco_super_secret_key_must_be_32_chars_min
app.jwt.expiration-ms=86400000

# ─── Swagger / OpenAPI ───────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.fitness.FitCo=DEBUG
